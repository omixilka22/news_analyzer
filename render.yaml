services:
  # 1. Твій Streamlit дашборд
  - type: web
    name: news-analyzer-dashboard
    env: docker
    repo: https://github.com/omixilka22/news_analyzer.git
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-analyzer-db
          property: connectionString

  # 2. Твій безкоштовний Cron Job (Запуск кожні 6 годин)
  - type: cron
    name: news-analyzer-scheduler
    env: docker
    repo: https://github.com/omixilka22/news_analyzer.git
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    # ВИПРАВЛЕНО: розклад на кожні 6 годин
    schedule: "0 */6 * * *"
    dockerCommand: python scheduler.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-analyzer-db
          property: connectionString
      - key: HF_TOKEN
        sync: false